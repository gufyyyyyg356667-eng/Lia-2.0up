name: Build Lia AI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create licence config (git-ignored)
        run: printf 'licenseBaseUrl=%s\n' "${{ secrets.LICENSE_BASE_URL }}" > license.properties

      - name: Unit tests
        run: gradle testPlayDebugUnitTest testDirectDebugUnitTest

      - name: Build debug APKs
        run: gradle assemblePlayDebug assembleDirectDebug

      - uses: actions/upload-artifact@v4
        with:
          name: lia-debug-apks
          path: app/build/outputs/apk/**/*.apk
